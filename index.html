<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velocity</title>
<meta name="theme-color" content="#ffffff" id="tc">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("velocity.theme")||"light"}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Velocity">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root,html[data-theme=light]{color-scheme:light;--bg:#fff;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--acc:#2563eb;--acch:#1d4ed8;--accbg:#eaf1ff;--onacc:#fff;--ev:#d97706;--evh:#b45309;--evbg:#fff4de;--warn:#dc2626;--soft:#f8fafc;--track:#eef2f7;--hov:#bfdbfe;--cf:#b45309;--cb:#fff4de;--g1:#3b82f6;--g2:#2563eb;--pnf:#475569;--pnb:#f1f5f9;--p0f:#b91c1c;--p0b:#fee2e2;--p1f:#c2410c;--p1b:#ffedd5;--p2f:#1d4ed8;--p2b:#dbeafe;--p3f:#475569;--p3b:#e2e8f0;--shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.06);--pb0:#fee2e2;--pe0:#dc2626;--pb1:#ffedd5;--pe1:#ea580c;--pb2:#dbeafe;--pe2:#2563eb;--pb3:#e2e8f0;--pe3:#64748b;--pb9:#f1f5f9;--pe9:#94a3b8}
html[data-theme=dark]{color-scheme:dark;--bg:#0b1020;--card:#141b2e;--ink:#e6eaf3;--mute:#8d99b0;--line:#26304a;--line2:#3a4663;--acc:#5b94ff;--acch:#7aa9ff;--accbg:#18284d;--onacc:#0b1020;--ev:#f59e0b;--evh:#fbbf24;--evbg:#3a2a0c;--warn:#f87171;--soft:#10172a;--track:#1f2842;--hov:#35508a;--cf:#fbbf24;--cb:#3a2a0c;--g1:#7aa9ff;--g2:#5b94ff;--pnf:#aab4c8;--pnb:#222c46;--p0f:#fca5a5;--p0b:#4a1d1d;--p1f:#fdba74;--p1b:#4a2a10;--p2f:#93c5fd;--p2b:#1c3158;--p3f:#aab4c8;--p3b:#2a3452;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);--pb0:#4a1d1d;--pe0:#f87171;--pb1:#4a2a10;--pe1:#fb923c;--pb2:#1c3158;--pe2:#5b94ff;--pb3:#2a3452;--pe3:#8d99b0;--pb9:#222c46;--pe9:#5d6a85}
html[data-theme=mono]{color-scheme:light;--bg:#f3f2ed;--card:#fbfbf8;--ink:#0a0a0a;--mute:#6b6b66;--line:#dddcd5;--line2:#bdbcb4;--acc:#111;--acch:#333;--accbg:#e6e5de;--onacc:#f3f2ed;--ev:#6b6b66;--evh:#4a4a46;--evbg:#e2e1da;--warn:#b91c1c;--soft:#eceae3;--track:#dddcd5;--hov:#9c9b93;--cf:#333;--cb:#e2e1da;--g1:#555;--g2:#111;--pnf:#555;--pnb:#e6e5de;--p0f:#f3f2ed;--p0b:#0a0a0a;--p1f:#f3f2ed;--p1b:#44443f;--p2f:#0a0a0a;--p2b:#bdbcb4;--p3f:#555;--p3b:#e6e5de;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.07);--pb0:#bdbcb4;--pe0:#0a0a0a;--pb1:#cfcec6;--pe1:#44443f;--pb2:#deddd5;--pe2:#7c7b74;--pb3:#e9e8e1;--pe3:#a9a8a0;--pb9:#eceae3;--pe9:#9c9b93}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.themes{display:flex;gap:6px}
.themes button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--line2);background-clip:padding-box}
.themes button[data-t=light]{background:linear-gradient(135deg,#fff 50%,#2563eb 50%)}
.themes button[data-t=dark]{background:linear-gradient(135deg,#0b1020 50%,#5b94ff 50%)}
.themes button[data-t=mono]{background:linear-gradient(135deg,#f3f2ed 50%,#111 50%)}
.themes button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.logo{display:block;height:52px;width:52px;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
h1{line-height:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
h1{margin:0}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0;font-weight:600}
.date{color:var(--mute);font-size:14px}
.count{font-size:32px;font-weight:700;color:var(--acc);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.count small{font-size:15px;color:var(--mute);font-weight:500}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:3px;width:0;transition:width .25s}
.pomo{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.pomo h2{flex:none}
#pomo{display:flex;gap:0;flex:1;flex-wrap:wrap;align-items:flex-end}
.pg{display:flex;flex-direction:column;gap:4px}
.pg+.pg{margin-left:16px;padding-left:16px;border-left:1px dashed var(--line2)}
.pgl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.pcs{display:flex;gap:8px}
.pplay{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600;padding:8px 14px;border-radius:999px;font-variant-numeric:tabular-nums;min-width:110px}
.pplay:hover:not(:disabled){background:var(--acch);border-color:var(--acch)}
.ppause{padding:8px 12px;border-radius:999px;font-weight:600}
.ppause[hidden]{display:none}
.pplay.run{background:var(--card);color:var(--acc)}
.pplay.run:hover:not(:disabled){background:var(--accbg)}
.pc{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);background:var(--card);padding:0;display:flex;align-items:center;justify-content:center;color:var(--onacc);font-size:16px;line-height:1}
.pc:hover:not(:disabled){border-color:var(--acc);background:var(--accbg)}
.pc.on,.pc.on:hover:not(:disabled){background:var(--acc);border-color:var(--acc)}
.pcount{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:20px;align-items:start}
.tabs{display:none}
@media(max-width:760px){
  .cols{grid-template-columns:minmax(0,1fr)}
  form{flex-wrap:nowrap}#np{flex:none;width:auto}
  .tabs{display:flex;gap:6px;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin:0 0 10px;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;padding:10px 8px;font-weight:600;border-radius:999px;background:var(--card);color:var(--mute)}
  .tabs button.on,.tabs button.on:hover:not(:disabled){background:var(--acc);border-color:var(--acc);color:var(--onacc)}
  .tabs small{font-weight:500;opacity:.8;margin-left:4px}
  .cols[data-tab=tasks] .cal{display:none}
  .cols[data-tab=cal] section{display:none}
}
form{display:flex;gap:8px;margin-bottom:14px}
input[type=text],select{padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
form input[type=text]{flex:1;min-width:0;padding:12px 14px;box-shadow:var(--shadow)}
input:disabled{opacity:.5}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:var(--soft);border-color:var(--line2)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
button.primary:hover:not(:disabled){background:var(--acch);border-color:var(--acch)}
button.evbtn{background:var(--ev);border-color:var(--ev);color:#fff;font-weight:600;padding:6px 12px;font-size:14px;border-radius:10px}
button.evbtn:hover:not(:disabled){background:var(--evh);border-color:var(--evh)}
button:disabled{opacity:.4;cursor:not-allowed}
.sec{margin-bottom:10px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;min-height:60px;border-radius:12px}
#list.over{outline:2px dashed var(--acc);outline-offset:4px}
.task{display:flex;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;box-shadow:var(--shadow)}
.task{cursor:pointer}
.task:hover{border-color:var(--hov)}
.task.done .txt{text-decoration:line-through;color:var(--mute)}
.task.dragging{opacity:.35}
.task.ins-l{box-shadow:-5px 0 0 var(--acc)}.task.ins-r{box-shadow:5px 0 0 var(--acc)}
.task.ins-t{box-shadow:0 -5px 0 var(--acc)}.task.ins-b{box-shadow:0 5px 0 var(--acc)}
.grip{cursor:grab;touch-action:none;user-select:none;color:var(--mute);padding:2px 4px;font-size:18px;line-height:1;letter-spacing:-2px}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);margin-top:3px;flex:none}
.body{flex:1;min-width:0}
.txt{word-break:break-word}
.time{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--acc);background:var(--accbg);border-radius:6px;padding:2px 7px}
.x{border:0;background:none;color:var(--mute);padding:0 4px;font-size:20px;line-height:1}
select.pri{appearance:none;-webkit-appearance:none;border:0;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;color:var(--pnf);background:var(--pnb);width:auto;box-shadow:none}
select.pri[data-p="0"]{color:var(--p0f);background:var(--p0b)}
select.pri[data-p="1"]{color:var(--p1f);background:var(--p1b)}
select.pri[data-p="2"]{color:var(--p2f);background:var(--p2b)}
select.pri[data-p="3"]{color:var(--p3f);background:var(--p3b)}
#np{padding:10px 8px;font-size:14px;font-weight:600}
.ghost .pri{display:none}
.empty{grid-column:1/-1;padding:28px;text-align:center;color:var(--mute);background:var(--soft);border:1px dashed var(--line2);border-radius:14px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1}
.warn{color:var(--warn)}
.msg{margin-top:10px;font-size:14px;color:var(--mute);min-height:20px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.calhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.datenav{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--mute);font-size:14px}
.datenav b{color:var(--ink);font-weight:600;min-width:112px;text-align:center}
.datenav button{padding:2px 9px;font-size:16px;border-radius:8px;line-height:1.3}
.datenav .tdy{font-size:12px;font-weight:600;color:var(--acc);background:var(--accbg);border-color:transparent}
.calfoot{padding:12px;border-top:1px solid var(--line);background:var(--soft)}
.calfoot button{width:100%;padding:12px;font-size:15px}
.cinfo{margin-top:6px;font-size:12.5px;color:var(--mute);text-align:center}
.carry{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--cf);background:var(--cb);border-radius:6px;padding:2px 7px}
.carry.rep{color:var(--acc);background:var(--accbg);margin-right:6px}
.calbtns{display:flex;gap:8px}
#clrcal{padding:6px 12px;font-size:14px;border-radius:10px}
#cal{position:relative}
.line{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.line.hour{border-top-color:var(--mute);opacity:.55}
.line span{position:absolute;left:12px;top:2px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
#track{position:absolute;left:58px;right:8px;top:0;bottom:0}
.blk{position:absolute;border-radius:6px;padding:0 4px;display:flex;align-items:center;gap:4px;font-size:13px;overflow:hidden;cursor:pointer;border-left:4px solid;line-height:1.15}
.blk.t{background:var(--accbg);border-color:var(--acc)}
.blk.e{background:var(--evbg);border-color:var(--ev)}
.blk.p0{background:var(--pb0);border-color:var(--pe0)}.blk.p1{background:var(--pb1);border-color:var(--pe1)}
.blk.p2{background:var(--pb2);border-color:var(--pe2)}.blk.p3{background:var(--pb3);border-color:var(--pe3)}
.blk.p9{background:var(--pb9);border-color:var(--pe9)}
.blk .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk small{color:var(--mute);font-size:11px;flex:none}
.blk.done .txt{text-decoration:line-through;color:var(--mute)}
.blk.done{background:var(--soft);border-color:var(--line2);opacity:.6}
.blk.done small{color:var(--mute)}
.blk.dragging{opacity:.35}
.blk .grip{padding:0 2px;font-size:15px}
.drop{position:absolute;left:0;right:0;background:var(--accbg);border:2px dashed var(--acc);border-radius:6px;pointer-events:none;display:none}
.ghost{position:fixed;z-index:99;pointer-events:none;width:220px;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:rotate(-1.5deg)}
.ghost .x,.ghost .time{display:none}
.ghost.blk{width:200px;height:34px!important;background:var(--card)}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.open{display:flex}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(15,23,42,.25);padding:20px;width:100%;max-width:360px}
.dlg h3{margin:0 0 12px;font-size:17px}
.dlg label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.dlg input[type=text],.dlg select{width:100%}
.dlg .r{display:flex;gap:8px}
.dlg .r>*{flex:1}
.dlg .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.dlg .row button{flex:1}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px}
.tag.t{color:var(--acc);background:var(--accbg)}.tag.e{color:var(--ev);background:var(--evbg)}
#pt{display:none}
@media print{
  .tabs{display:none!important}.cols .cal{display:block!important}
  html[data-theme]{color-scheme:light;--bg:#fff;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--acc:#2563eb;--accbg:#eaf1ff;--ev:#d97706;--evbg:#fff4de;--soft:#f8fafc;--pb0:#fee2e2;--pe0:#dc2626;--pb1:#ffedd5;--pe1:#ea580c;--pb2:#dbeafe;--pe2:#2563eb;--pb3:#e2e8f0;--pe3:#64748b;--pb9:#f1f5f9;--pe9:#94a3b8}
  .themes{display:none}
  @page{margin:12mm}
  body{background:var(--card)}
  .wrap{max-width:none;padding:0}
  .bar,.pomo,.count,.datenav button,.calhead,.calfoot,section,#modal,.msg{display:none!important}
  header{margin-bottom:8px}
  .cols{display:block}
  .cal{box-shadow:none;border:1px solid #94a3b8;border-radius:0;max-width:none;break-inside:avoid}
  .blk,.line,.task,.tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .blk{border-radius:3px}.blk .grip{display:none}
  #pt{display:block;margin-top:14px;break-inside:avoid}
  #pt h2{margin-bottom:6px;color:#000}
  #pt ul{margin:0;padding:0;list-style:none;columns:2}
  #pt li{padding:3px 0;border-bottom:1px solid #e2e8f0;break-inside:avoid;font-size:13px}
  #pt li:before{content:"☐ "}
  #pt li.d{color:#64748b;text-decoration:line-through}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1><img class="logo" src="icons/icon-192.png" srcset="icons/icon-192.png 1x, icons/icon-512.png 3x" alt="Velocity" width="52" height="52"></h1><div class="datenav" id="date"></div></div>
    <div class="hr">
      <div class="themes" role="group" aria-label="Theme"><button data-t="light" title="Light" aria-label="Light theme"></button><button data-t="dark" title="Dark" aria-label="Dark theme"></button><button data-t="mono" title="Mono" aria-label="Mono theme"></button></div>
      <div class="count"><span id="n">0</span><small> / 15</small></div>
    </div>
  </header>
  <div class="bar"><i id="bar"></i></div>
  <div class="pomo"><h2>Pomodoros</h2><button class="pplay" id="pplay">▶ Start</button><button id="ppause" class="ppause" hidden>⏸ Pause</button><div id="pomo"></div><span class="pcount" id="pcount"></span></div>
  <nav class="tabs" role="tablist"><button role="tab" data-tab="tasks" id="tabT"></button><button role="tab" data-tab="cal" id="tabC"></button></nav>
  <div class="cols" id="cols" data-tab="tasks">
    <section>
      <form id="f">
        <input type="text" id="t" placeholder="Add a task" maxlength="200" autocomplete="off">
        <select id="np" title="Priority"><option value="">Priority</option><option value="0">P0</option><option value="1">P1</option><option value="2">P2</option><option value="3">P3</option></select>
        <button class="primary" id="add">Add</button>
      </form>
      <div class="sec"><h2>Tasks · drag the ⋮⋮ handle onto the calendar</h2></div>
      <div id="list"></div>
      <div class="actions">
        <button id="undo" disabled>↶ Undo</button>
        <button id="refresh" class="warn">↻ Refresh list</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="msg" id="sync"></div>
    </section>
    <aside class="cal">
      <div class="calhead"><h2>Schedule</h2><div class="calbtns"><button id="prt" title="Print this day">🖨 Print</button><button class="warn" id="clrcal">↻ Clear</button><button class="evbtn" id="addev">+ Event</button></div></div>
      <div id="cal"></div>
      <div class="calfoot">
        <button class="primary" id="complete">✓ Complete today</button>
        <div class="cinfo" id="cinfo"></div>
      </div>
    </aside>
  </div>
</div>
<div id="pt"></div>
<div id="modal"><div class="dlg" id="dlg"></div></div>
<script src="config.js"></script>
<script>
const MAX=15, KEY="today15.v4", PPM=2, TOTAL=420, DEF=15; // minutes after 11:00; 2px per minute
const POMOS=8;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=a=>JSON.parse(JSON.stringify(a));
const pad=n=>String(n).padStart(2,"0");
/* ---------- multi-day state ---------- */
// days[YYYY-MM-DD] = {tasks:[{id,text,done,start|null,dur,p,c}], events:[{id,title,start,dur}], pomo:[bool x8]}
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
// Fri (5) and Sat (6) are the weekend: carry-over skips them and lands on Sunday.
// The days themselves stay navigable for one-off events.
const isWeekend=k=>{const w=parseKey(k).getDay();return w===5||w===6};
const nextWorkday=k=>{let n=addDays(k,1);while(isWeekend(n))n=addDays(n,1);return n};
const dayLabel=k=>parseKey(k).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const emptyDay=()=>({tasks:[],events:[],pomo:Array(POMOS).fill(false)});
const getDay=k=>state.days[k]||(state.days[k]=emptyDay());
const state={days:{},cur:keyOf(new Date()),ptimer:null,undo:null};
Object.defineProperties(state,{ // current-day shortcuts (non-enumerable, so not serialized)
  tasks:{get(){return getDay(state.cur).tasks},set(v){getDay(state.cur).tasks=v}},
  events:{get(){return getDay(state.cur).events},set(v){getDay(state.cur).events=v}},
  pomo:{get(){return getDay(state.cur).pomo},set(v){getDay(state.cur).pomo=v}}
});
const snap=()=>({days:clone(state.days),cur:state.cur});
function serialize(){
  const days={};
  for(const [k,v] of Object.entries(state.days)) if(v.tasks.length||v.events.length||v.pomo.some(Boolean)) days[k]=v;
  return {v:5,days,cur:state.cur,ptimer:state.ptimer,undo:state.undo};
}
const pv=k=>k.p==null?9:k.p;
// Put a task after the last task of equal-or-higher priority (used for new tasks / priority changes).
function placeByPriority(arr,k){
  const i=arr.indexOf(k); if(i>=0)arr.splice(i,1);
  let at=0; arr.forEach((z,j)=>{if(pv(z)<=pv(k))at=j+1});
  arr.splice(at,0,k);
}
function fmt(min){const m=660+min;return pad(Math.floor(m/60))+":"+pad(m%60)}
function rng(a){return fmt(a.start)+"–"+fmt(a.start+a.dur)}

  const d=document.createElement("div"); d.className="task"+(k.done?" done":"")+(cls?" "+cls:""); d.dataset.id=k.id;
  const g=document.createElement("div"); g.className="grip"; g.textContent="⋮⋮"; g.title="Drag to calendar";

  const c=document.createElement("input"); c.type="checkbox"; c.checked=k.done;
  c.onchange=()=>{k.done=c.checked;save();render()};
  const b=document.createElement("div"); b.className="body";

  const pr=document.createElement("select"); pr.className="pri"; pr.title="Priority";

  pr.value=k.p==null?"":String(k.p); pr.dataset.p=pr.value;
  pr.onchange=()=>{k.p=pr.value===""?null:+pr.value;placeByPriority(state.tasks,k);save();render()};
  b.append(pr);
  if(k.rep){const rp=document.createElement("span"); rp.className="carry rep"; rp.textContent="↻ repeats daily"; b.append(rp)}
  if(k.c>0){const cr=document.createElement("span"); cr.className="carry"; cr.textContent="↪ carried "+(k.c>1?"×"+k.c:"over"); b.append(cr)}
  if(k.start!=null){const t=document.createElement("span"); t.className="time"; t.textContent="🕒 "+rng(k); b.append(t)}

  x.onclick=()=>{state.tasks=state.tasks.filter(z=>z.id!==k.id);save();render()};
  d.append(g,c,b,x); return d;
}

/* ---------- calendar ---------- */
function layout(items){
  // lane assignment for overlapping blocks
  items.sort((a,b)=>a.it.start-b.it.start||b.it.dur-a.it.dur);
  let cluster=[],end=-1;
  const flush=()=>{const n=Math.max(1,...cluster.map(c=>c.lane+1));cluster.forEach(c=>c.lanes=n);cluster=[]};
  items.forEach(o=>{
    if(o.it.start>=end&&cluster.length){flush();end=-1}
    const used=cluster.filter(c=>c.it.start+c.it.dur>o.it.start).map(c=>c.lane);
    let l=0;while(used.includes(l))l++;
    o.lane=l;cluster.push(o);end=Math.max(end,o.it.start+o.it.dur);
  });
  flush();
}
function renderCal(){
  const cal=$("cal"); cal.innerHTML=""; cal.style.height=(TOTAL*PPM)+"px";
  for(let m=0;m<=TOTAL;m+=30){
    const l=document.createElement("div"); l.className="line"+(m%60===0?" hour":""); l.style.top=(m*PPM)+"px";
    l.innerHTML="<span>"+(m<TOTAL?fmt(m):"")+"</span>"; cal.append(l);
  }
  const tr=document.createElement("div"); tr.id="track"; cal.append(tr);
  const dp=document.createElement("div"); dp.className="drop"; dp.id="drop"; tr.append(dp);
  const items=[
    ...state.tasks.filter(k=>k.start!=null).map(k=>({it:k,kind:"task"})),
    ...state.events.map(k=>({it:k,kind:"event"}))
  ];
  layout(items);
  items.forEach(o=>{
    const k=o.it, e=o.kind==="event";
    const b=document.createElement("div"); b.className="blk "+(e?"e":"t p"+pv(k))+(k.done?" done":"");
    const w=100/o.lanes;
    b.style.top=(k.start*PPM+1)+"px"; b.style.height=(k.dur*PPM-2)+"px";
    b.style.left=(o.lane*w)+"%"; b.style.width="calc("+w+"% - 2px)";
    const g=document.createElement("div"); g.className="grip"; g.textContent="⋮⋮";
    g.addEventListener("pointerdown",ev=>startDrag(ev,k,o.kind,b));
    const tx=document.createElement("div"); tx.className="txt"; tx.textContent=e?k.title:(k.rep?"↻ ":"")+(k.p!=null?"P"+k.p+" · ":"")+k.text;
    const sm=document.createElement("small"); sm.textContent=fmt(k.start);
    b.append(g,tx,sm); b.onclick=()=>openEditor(k,o.kind,false);
    tr.append(b);
  });
}

/* ---------- pomodoro timer ---------- */
const POMO_MS=25*60*1000;
let actx=null;
function beep(){
  try{
    if(!actx)return;
    [0,.25,.5].forEach(d=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.frequency.value=880;o.connect(g);g.connect(actx.destination);
      const t=actx.currentTime+d;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
      o.start(t);o.stop(t+.22);
    });
  }catch(e){}
}
function renderTimer(){
  const b=$("pplay"), pb=$("ppause"); if(!b)return;
  if(state.ptimer){
    const paused=!!state.ptimer.paused;
    const left=paused?state.ptimer.left:Math.max(0,state.ptimer.end-Date.now()), s=Math.ceil(left/1000);
    const txt=pad(Math.floor(s/60))+":"+pad(s%60);
    b.className="pplay run"; b.textContent=(paused?"⏸ ":"■ ")+txt; b.title="Stop timer";
    document.title=(paused?"⏸ ":"⏱ ")+txt+" · Velocity";
    pb.hidden=false; pb.textContent=paused?"▶ Resume":"⏸ Pause";
  }else{
    pb.hidden=true;
    b.className="pplay"; b.textContent="▶ Start"; b.title="Start a 25-minute pomodoro";
    document.title="Velocity";
  }
}
function finishTimer(){
  state.ptimer=null;
  const i=state.pomo.indexOf(false);
  if(i>=0)state.pomo[i]=true;
  save(); render(); beep();
  msg(i>=0?"Pomodoro complete. Logged to circle "+(i+1)+".":"Pomodoro complete. All 8 circles are already filled.");
}
function tick(){
  if(!state.ptimer||state.ptimer.paused)return;
  if(Date.now()>=state.ptimer.end)finishTimer(); else renderTimer();
}
setInterval(tick,500);
$("pplay").onclick=()=>{
  if(state.ptimer){state.ptimer=null;save();renderTimer();msg("Timer stopped. Nothing logged.");return}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}
  state.ptimer={end:Date.now()+POMO_MS}; msg("Pomodoro started. 25 minutes."); save(); renderTimer();
};
$("ppause").onclick=()=>{
  const t=state.ptimer; if(!t)return;
  if(t.paused){state.ptimer={end:Date.now()+t.left};msg("Pomodoro resumed.")}
  else{state.ptimer={paused:true,left:Math.max(0,t.end-Date.now())};msg("Pomodoro paused. Tap Resume to continue.")}
  save(); renderTimer();
};
function renderDate(){
  const box=$("date"); box.innerHTML="";
  const go=(n)=>{state.cur=addDays(state.cur,n);save();msg("");render()};
  const p=document.createElement("button"); p.textContent="‹"; p.title="Previous day"; p.onclick=()=>go(-1);
  const l=document.createElement("b"); l.textContent=dayLabel(state.cur);
  const n=document.createElement("button"); n.textContent="›"; n.title="Next day"; n.onclick=()=>go(1);
  box.append(p,l,n);

  if(state.cur!==tk){const t=document.createElement("button"); t.className="tdy"; t.textContent=state.cur<tk?"Jump to today":"Back to today"; t.onclick=()=>{state.cur=tk;save();msg("");render()}; box.append(t)}
  const unf=state.tasks.filter(k=>!k.done).length, nk=nextWorkday(state.cur);

/* ---------- complete the day: carry unfinished work forward ---------- */
function completeDay(){
  const d=getDay(state.cur), nk=nextWorkday(state.cur), nd=getDay(nk);
  const unf=d.tasks.filter(k=>!k.done);
  const sched=unf.filter(k=>k.start!=null).sort((a,b)=>a.start-b.start);
  const loose=unf.filter(k=>k.start==null);
  const room=Math.max(0,MAX-nd.tasks.length);
  const mv=[...sched,...loose].slice(0,room), left=unf.length-mv.length;
  // tasks marked "done and repeat tomorrow" come back as fresh copies after the carried ones
  const reps=d.tasks.filter(k=>k.done&&k.rep).slice(0,Math.max(0,room-mv.length));
  const repLeft=d.tasks.filter(k=>k.done&&k.rep).length-reps.length;
  state.undo=snap();
  // first-fit placement from 11:00 around anything already on the next day
  const busy=[...nd.tasks.filter(k=>k.start!=null),...nd.events].map(x=>({s:x.start,e:x.start+x.dur}));
  const free=(c,dur)=>c>=0&&c+dur<=TOTAL&&!busy.some(b=>c<b.e&&c+dur>b.s);
  const fit=(dur,pref)=>{
    if(pref!=null&&free(pref,dur))return pref;
    for(let c=0;c+dur<=TOTAL;c+=15) if(free(c,dur))return c;
    return null;
  };
  let placed=0;
  mv.forEach(k=>{
    if(k.start!=null){
      const s=fit(k.dur,null);
      if(s!=null){busy.push({s,e:s+k.dur});placed++}
      k.start=s;
    }
    k.c=(k.c||0)+1;
    nd.tasks.push(k); placeByPriority(nd.tasks,k);
  });
  reps.forEach(k=>{
    const s=k.start!=null?fit(k.dur,k.start):null;
    if(s!=null)busy.push({s,e:s+k.dur});
    {const nt={id:uid(),text:k.text,done:false,start:s,dur:k.dur,p:k.p,c:0,rep:true};nd.tasks.push(nt);placeByPriority(nd.tasks,nt)}
  });
  const ids=new Set(mv.map(k=>k.id));
  d.tasks=d.tasks.filter(k=>!ids.has(k.id));
  const from=state.cur; state.cur=nk;
  let m=mv.length?mv.length+" unfinished task"+(mv.length>1?"s":"")+" moved to "+dayLabel(nk)+(placed?" ("+placed+" on the calendar, first thing)":"")+".":"Day complete. Nothing to carry over.";
  if(reps.length)m+=" "+reps.length+" repeating task"+(reps.length>1?"s":"")+" added to "+dayLabel(nk)+".";
  if(left>0)m+=" "+left+" couldn't move because "+dayLabel(nk)+" is full (15 max) and stayed on "+dayLabel(from)+".";
  if(repLeft>0)m+=" "+repLeft+" repeating task"+(repLeft>1?"s":"")+" couldn't be added (day full).";
  m+=" Undo reverses it.";
  tab="tasks"; save(); render(); msg(m); window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- drag (mouse + touch) ---------- */
function startDrag(e,k,kind,srcEl){
  e.preventDefault(); e.stopPropagation();
  const sx=e.clientX, sy=e.clientY; let ghost=null;
  const grip=e.currentTarget; try{grip.setPointerCapture(e.pointerId)}catch(_){}
  const dur=k.dur||DEF;
  function where(x,y){
    const el=document.elementFromPoint(x,y); if(!el)return null;
    const tr=el.closest("#track")||el.closest(".line"); if(tr)return {type:"cal"};
    const l=el.closest("#list"); if(l&&kind==="task")return {type:"list",el:l};
    return null;
  }
  function startAt(y){
    const tr=$("track").getBoundingClientRect();
    let m=Math.round((y-tr.top)/PPM/15)*15;
    return Math.max(0,Math.min(TOTAL-dur,m));
  }
  function listPos(x,y){
    const cards=[...$("list").querySelectorAll(".task")].filter(c=>c.dataset.id!==k.id);
    if(!cards.length)return null;
    let best=null,bd=1e9;
    cards.forEach(c=>{const r=c.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<bd){bd=d;best=c}});
    const r=best.getBoundingClientRect(), single=cards.every(c=>c.offsetLeft===cards[0].offsetLeft);
    return {id:best.dataset.id,el:best,before:single?y<r.top+r.height/2:x<r.left+r.width/2,single};
  }
  function indicate(w,y,x){
    const dp=$("drop"), ls=$("list");
    ls.classList.toggle("over",!!w&&w.type==="list");
    ls.querySelectorAll(".task").forEach(c=>c.classList.remove("ins-l","ins-r","ins-t","ins-b"));
    if(w&&w.type==="list"&&kind==="task"){const p=listPos(x,y);if(p)p.el.classList.add(p.single?(p.before?"ins-t":"ins-b"):(p.before?"ins-l":"ins-r"))}
    if(w&&w.type==="cal"){const s=startAt(y);dp.style.display="block";dp.style.top=(s*PPM)+"px";dp.style.height=(dur*PPM)+"px"}
    else dp.style.display="none";
  }
  function move(ev){
    if(!ghost){
      if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<5)return;
      ghost=kind==="task"?card(k,"ghost"):(()=>{const g=srcEl.cloneNode(true);g.classList.add("ghost");return g})();
      document.body.append(ghost); srcEl.classList.add("dragging");
    }
    ghost.style.left=(ev.clientX-20)+"px"; ghost.style.top=(ev.clientY-20)+"px";
    indicate(where(ev.clientX,ev.clientY),ev.clientY,ev.clientX);
    if(ev.clientY<60)window.scrollBy(0,-12); else if(ev.clientY>innerHeight-60)window.scrollBy(0,12);
  }
  function up(ev){
    grip.removeEventListener("pointermove",move); grip.removeEventListener("pointerup",up); grip.removeEventListener("pointercancel",up);
    if(!ghost)return;
    const w=where(ev.clientX,ev.clientY), s=w&&w.type==="cal"?startAt(ev.clientY):null;
    const lp=w&&w.type==="list"&&kind==="task"?listPos(ev.clientX,ev.clientY):null;
    ghost.remove(); srcEl.classList.remove("dragging"); $("list").classList.remove("over");
    if(!w){render();return}
    if(w.type==="list"){
      k.start=null;
      if(lp){const a=state.tasks, from=a.indexOf(k); if(from>=0)a.splice(from,1);
        let at=a.findIndex(z=>z.id===lp.id); at=at<0?a.length:at+(lp.before?0:1); a.splice(at,0,k)}
    }
    else{k.start=s;k.dur=dur}
    save(); render();
  }
  grip.addEventListener("pointermove",move); grip.addEventListener("pointerup",up); grip.addEventListener("pointercancel",up);
}

/* ---------- editor dialog ---------- */
function closeEditor(){$("modal").classList.remove("open");$("dlg").innerHTML=""}
function openEditor(k,kind,isNew){
  const e=kind==="event", dlg=$("dlg");
  let startOpts=e?"":'<option value="">Not scheduled</option>';
  for(let m=0;m<TOTAL;m+=15)startOpts+=`<option value="${m}">${fmt(m)}</option>`;
  dlg.innerHTML=`
    <h3><span class="tag ${e?"e":"t"}">${e?"Event":"Task"}</span> ${isNew?"New event":(e?"Edit event":"Edit task")}</h3>
    ${e?`<label>Title</label><input type="text" id="etitle" maxlength="80" placeholder="e.g. Team meeting, Lunch">`:`<div class="txt">${esc(k.text)}</div>`}
    <div class="r"><div><label>Start</label><select id="est">${startOpts}</select></div>
    <div><label>Duration</label><select id="edu"></select></div></div>
    <div class="row">
      ${!e?`<button id="edone"></button>`:""}
      ${!e?(k.rep?`<button id="erep">⏹ Stop repeating</button>`:`<button id="erep" class="primary">✓ Done &amp; repeat tomorrow</button>`):""}
      ${!e&&k.start!=null?`<button id="eun">Unschedule</button>`:""}
      ${e&&!isNew?`<button id="edel" class="warn">Delete</button>`:""}
    </div>
    <div class="row"><button id="ecan">Cancel</button><button id="esave" class="primary">Save</button></div>`;
  const st=$("est"), du=$("edu");
  st.value=k.start==null?"":String(k.start);
  function fillDur(sel){
    const max=TOTAL-(st.value===""?0:+st.value); let h="";
    [15,30,45,60,75,90,120,150,180].filter(d=>d<=max).forEach(d=>h+=`<option value="${d}">${d>=60?(d/60)+"h"+(d%60?" "+(d%60)+"m":""):d+" min"}</option>`);
    du.innerHTML=h; du.value=String(Math.min(sel,max)); if(!du.value)du.value=du.options[du.options.length-1].value;
  }
  fillDur(k.dur||DEF); st.onchange=()=>fillDur(+du.value);
  if(e)$("etitle").value=k.title||"";
  if(!e){
    const d=$("edone"); d.textContent=k.done?"☐ Mark not done":"✓ Mark done";
    d.onclick=()=>{k.done=!k.done;save();render();closeEditor()};
    $("erep").onclick=()=>{
      if(k.rep){k.rep=false}else{k.rep=true;k.done=true}
      save();render();closeEditor();
    };
    const u=$("eun"); if(u)u.onclick=()=>{k.start=null;save();render();closeEditor()};
  }else{
    const dl=$("edel"); if(dl)dl.onclick=()=>{state.events=state.events.filter(z=>z.id!==k.id);save();render();closeEditor()};
  }
  $("ecan").onclick=closeEditor;
  $("esave").onclick=()=>{
    if(e){
      const t=$("etitle").value.trim(); if(!t){$("etitle").focus();return}
      k.title=t;
      if(isNew)state.events.push(k);
    }
    k.start=st.value===""?null:+st.value; k.dur=+du.value;
    save();render();closeEditor();
  };
  $("modal").classList.add("open");
  if(e)$("etitle").focus();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
$("modal").onclick=ev=>{if(ev.target.id==="modal")closeEditor()};
$("addev").onclick=()=>openEditor({id:uid(),title:"",start:120,dur:60},"event",true);

/* ---------- list actions ---------- */
$("f").onsubmit=e=>{
  e.preventDefault();
  const v=$("t").value.trim();
  if(!v||state.tasks.length>=MAX)return;
  const pvl=$("np").value;
  {const nt={id:uid(),text:v,done:false,start:null,dur:DEF,p:pvl===""?null:+pvl};state.tasks.push(nt);placeByPriority(state.tasks,nt)}
  $("t").value=""; msg(""); save(); render(); $("t").focus();
};
$("refresh").onclick=()=>{
  if(!state.tasks.length&&!state.events.length&&!state.pomo.some(Boolean))return;
  state.undo=snap();
  state.tasks=[]; state.events=[]; state.pomo=Array(POMOS).fill(false);
  msg("Tasks, schedule and pomodoros cleared. Tap Undo to bring them back."); save(); render();
};
$("clrcal").onclick=()=>{
  if(!state.events.length&&!state.tasks.some(k=>k.start!=null))return;
  state.undo=snap();
  state.tasks.forEach(k=>k.start=null); state.events=[];
  msg("Calendar cleared. Tasks are still in your list. Tap Undo to restore."); save(); render();
};
$("undo").onclick=()=>{
  if(!state.undo)return;
  state.days=state.undo.days; state.cur=state.undo.cur; state.undo=null;
  msg("Restored."); save(); render();
};
$("complete").onclick=completeDay;
$("prt").onclick=()=>window.print();
// Fill the print-only list of tasks that aren't on the calendar yet
function fillPrint(){
  const rest=state.tasks.filter(k=>k.start==null);
  const pt=$("pt"); pt.innerHTML="";
  if(!rest.length)return;
  const h=document.createElement("h2"); h.textContent="Unscheduled tasks"; pt.append(h);
  const ul=document.createElement("ul");
  rest.forEach(k=>{const li=document.createElement("li"); if(k.done)li.className="d"; li.textContent=(k.p!=null?"P"+k.p+" · ":"")+k.text; ul.append(li)});
  pt.append(ul);
}
addEventListener("beforeprint",fillPrint);

/* ---------- themes (per device, kept out of the synced data) ---------- */
const THEME_BG={light:"#ffffff",dark:"#0b1020",mono:"#f3f2ed"};
function setTheme(t,persist){
  if(!THEME_BG[t])t="light";
  document.documentElement.dataset.theme=t; $("tc").content=THEME_BG[t];
  document.querySelectorAll(".themes button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  if(persist)try{localStorage.setItem("velocity.theme",t)}catch(e){}
}
document.querySelectorAll(".themes button").forEach(b=>b.onclick=()=>setTheme(b.dataset.t,true));
setTheme(document.documentElement.dataset.theme,false);

/* ---------- load ---------- */
const clampStart=n=>Number.isFinite(n)?Math.max(0,Math.min(TOTAL-15,Math.round(n/15)*15)):null;
function normT(a){return a.slice(0,MAX).map(k=>{
  let s=Number.isFinite(k.start)?k.start:(Number.isInteger(k.slot)?k.slot*30:null); // v1/v2 migration
  s=s==null?null:clampStart(s);
  const d=Math.max(15,Math.min(TOTAL-(s||0),Number(k.dur)||DEF));
  return {id:k.id||uid(),text:String(k.text||""),done:!!k.done,start:s,dur:d,p:Number.isInteger(k.p)&&k.p>=0&&k.p<=3?k.p:null,c:Number.isInteger(k.c)&&k.c>0?k.c:0,rep:!!k.rep};
})}
function normE(a){return (a||[]).map(k=>{const s=clampStart(k.start)||0;return {id:k.id||uid(),title:String(k.title||"Event"),start:s,dur:Math.max(15,Math.min(TOTAL-s,Number(k.dur)||60))}})}
const normP=a=>Array.from({length:POMOS},(_,i)=>Array.isArray(a)&&!!a[i]);
const validKey=k=>typeof k==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(k);
function normDays(o){
  const out={};
  for(const [k,v] of Object.entries(o||{})) if(validKey(k)&&v) out[k]={tasks:normT(v.tasks||[]),events:normE(v.events),pomo:normP(v.pomo)};
  return out;
}
function load(raw){
  try{
    const s=JSON.parse(raw); if(!s)return;
    let days,cur,undo=null;
    if(s.days&&typeof s.days==="object"){
      days=normDays(s.days); cur=validKey(s.cur)?s.cur:keyOf(new Date());
      if(s.undo&&s.undo.days)undo={days:normDays(s.undo.days),cur:validKey(s.undo.cur)?s.undo.cur:cur};
    }else if(Array.isArray(s.tasks)){ // older single-day save: becomes today
      cur=keyOf(new Date());
      days={[cur]:{tasks:normT(s.tasks),events:normE(s.events),pomo:normP(s.pomo)}};
    }else return;
    if(!(s.v>=5)){ // v<5 displayed tasks sorted by priority; bake that order in once
      const srt=o=>Object.values(o).forEach(d=>{d.tasks=d.tasks.map((k,i)=>({k,i})).sort((a,b)=>pv(a.k)-pv(b.k)||a.i-b.i).map(o=>o.k)});
      srt(days); if(undo)srt(undo.days);
    }
    state.days=days; state.cur=cur; state.undo=undo;
    state.ptimer=s.ptimer&&s.ptimer.paused&&Number.isFinite(s.ptimer.left)?{paused:true,left:Math.max(0,Math.min(POMO_MS,s.ptimer.left))}:(s.ptimer&&Number.isFinite(s.ptimer.end)?{end:s.ptimer.end}:null);
  }catch(e){}
}
try{const r=localStorage.getItem(KEY)||localStorage.getItem("today15.v3")||localStorage.getItem("today15.v2")||localStorage.getItem("today15.v1"); if(r)load(r)}catch(e){}
render();
sbLoad();
if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
